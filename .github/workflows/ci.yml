name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Version
        run: node scripts/check-version.mjs

      - name: UTF-8
        run: node scripts/check-utf8.mjs

      # La guarda que impide que una prueba alcance el Supabase de la doctora.
      # Corre aquí, sin base y sin credenciales, para que el candado tenga
      # quien lo rompa antes de que haga falta.
      - name: Guarda anti-producción
        run: node scripts/check-guardia.mjs

      - name: Release metadata
        run: node scripts/release-metadata.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
